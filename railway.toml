[build]
builder = "RAILPACK"
buildCommand = "pip install --target /app/.python ."

[deploy]
preDeployCommand = ["PYTHONPATH=/app/.python python -m alembic upgrade head"]
startCommand = "PYTHONPATH=/app/.python python -m korgan_legal_ai.telegram.main"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
