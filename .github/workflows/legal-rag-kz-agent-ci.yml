name: Kazakhstan legal RAG agent CI

on:
  pull_request:
    branches:
      - recovery/agent-1600-sg
    paths:
      - 'korgan/legal/**'
      - 'korgan/legacy_agent_rag_bridge.py'
      - 'korgan/__init__.py'
      - 'korgan/openai_legal.py'
      - 'tests/test_legal_pipeline_flag.py'
      - 'tests/test_upstream_legal_rag_kz.py'
      - 'tests/test_legacy_agent_rag_bridge.py'
      - '.github/workflows/legal-rag-kz-agent-ci.yml'
  push:
    branches:
      - feat/legal-rag-kz-agent-production
      - hotfix/legal-rag-agent-direct

jobs:
  legal-rag-agent:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: test-token
      OPENAI_API_KEY: test-key
      KORGAN_LOCAL_CORPUS: '1'
      KORGAN_CORPUS_AUTOLOAD: '0'
      KORGAN_UPSTREAM_RAG_AUTOLOAD: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile agent and RAG modules
        run: >-
          python -m py_compile
          korgan/legal/corpus.py
          korgan/legal/upstream_rag.py
          korgan/legal/pipeline.py
          korgan/legacy_agent_rag_bridge.py
          korgan/openai_legal.py
          korgan/bot.py
      - name: Run Kazakhstan-only retrieval tests
        run: >-
          python -m pytest -q
          tests/test_legal_pipeline_flag.py
          tests/test_upstream_legal_rag_kz.py
          tests/test_legacy_agent_rag_bridge.py
          tests/test_legal_corpus_db.py
      - name: Import live Telegram entrypoint
        run: python -c "import korgan.bot; from korgan.openai_legal import OpenAILegalService; assert getattr(OpenAILegalService, '_korgan_kz_local_rag_bridge_installed', False); print('korgan.bot + KZ RAG bridge import ok')"
