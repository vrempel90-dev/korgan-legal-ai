name: MiniApp Kaspi payment Web draft CI

on:
  push:
    branches:
      - fix/stable-miniapp-payments-web
  pull_request:
    branches:
      - recovery/miniapp-web-1600-sg

jobs:
  miniapp-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build MiniApp
        run: npm run build
      - name: Run frontend regression suite
        run: npm test
