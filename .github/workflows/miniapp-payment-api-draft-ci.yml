name: MiniApp Kaspi payment API draft CI

on:
  push:
    branches:
      - fix/stable-miniapp-payments-api
  pull_request:
    branches:
      - recovery/miniapp-api-1600-sg

jobs:
  payment-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: korgan
          POSTGRES_PASSWORD: korgan-test
          POSTGRES_DB: korgan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U korgan -d korgan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TELEGRAM_BOT_TOKEN: test-token
      OPENAI_API_KEY: test-key
      DATABASE_URL: postgresql://korgan:korgan-test@127.0.0.1:5432/korgan_test
      PAYMENTS_ENABLED: "false"
      CONSULTATION_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile payment stack
        run: >-
          python -m py_compile
          korgan/kaspi_ofd.py
          korgan/kaspi_payment_resilience.py
          korgan/kaspi_receipt_policy.py
          korgan/fiscal_qr_extract.py
          korgan/miniapp_api_ofd.py
          korgan/miniapp_api_ofd_upload.py
          korgan/miniapp_document_access.py
          korgan/payment_operation_lock.py
          korgan/miniapp_payment_idempotency.py
          korgan/miniapp_api_recovery_cors.py
          korgan/consultation_quota.py
      - name: Import complete ASGI stack
        run: python -c "from korgan.miniapp_api_recovery_cors import app; from korgan.miniapp_document_access import router; assert app is not None; paths={getattr(r,'path','') for r in router.routes}; assert '/miniapp/cases/{case_id}/document/access' in paths; assert '/miniapp/document/download' in paths; assert '/miniapp/document/preview' in paths; print(len(app.routes))"
      - name: Run payment, OFD and stored-document tests
        run: >-
          python -m pytest -q
          tests/test_kaspi_ofd.py
          tests/test_kaspi_payment_resilience.py
          tests/test_kaspi_receipt_policy.py
          tests/test_consultation_quota.py
          tests/test_miniapp_payment_idempotency.py
          tests/test_zz_miniapp_ai_payment_parity_v5.py
          tests/test_miniapp_ofd_autogeneration.py
          tests/test_miniapp_client_receipt_policy.py
          tests/test_miniapp_document_access.py
      - name: Run MiniApp smoke regressions
        run: >-
          python -m pytest -q
          tests/test_miniapp_api_smoke.py
          tests/test_miniapp_business_parity_v4.py
