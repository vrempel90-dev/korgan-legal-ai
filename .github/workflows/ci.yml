name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: korgan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d korgan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/korgan_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/korgan_test
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: pytest -q

  live-embedding-acceptance:
    if: github.event_name == 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: korgan_live_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d korgan_live_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/korgan_live_acceptance
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KORGAN_EMBEDDING_MODEL: text-embedding-3-large
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - name: Verify secret is configured without exposing it
        run: test -n "$OPENAI_API_KEY"
      - name: Run live OpenAI embedding acceptance
        run: python scripts/verify_live_embeddings.py
