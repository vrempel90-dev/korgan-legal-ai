name: Fix Mini App OFD CORS

on:
  push:
    branches:
      - feat/miniapp-full-agent-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/miniapp-full-agent-parity
      - name: Add production Mini App origin
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('korgan/miniapp_api_v2.py')
          source = path.read_text(encoding='utf-8')
          old = '        "https://korgan-miniapp-staging-production.up.railway.app",\n        "http://localhost:5173",'
          new = '        "https://korgan-miniapp-staging-production.up.railway.app",\n        "https://korgan-miniapp-ofd-production.up.railway.app",\n        "http://localhost:5173",'
          if 'https://korgan-miniapp-ofd-production.up.railway.app' not in source:
              if old not in source:
                  raise SystemExit('expected CORS origin block not found')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          compile(source, str(path), 'exec')
          PY
      - name: Add regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_zz_miniapp_kaspi_ofd_v6.py')
          source = path.read_text(encoding='utf-8')
          marker = 'def test_ofd_frontend_origin_is_allowed_by_api_cors() -> None:'
          if marker not in source:
              source += '''\n\ndef test_ofd_frontend_origin_is_allowed_by_api_cors() -> None:\n    source = Path("korgan/miniapp_api_v2.py").read_text(encoding="utf-8")\n    assert "https://korgan-miniapp-ofd-production.up.railway.app" in source\n'''
          path.write_text(source, encoding='utf-8')
          PY
      - name: Run focused tests
        run: |
          python -m pip install -r requirements.txt >/dev/null
          pytest -q tests/test_zz_miniapp_kaspi_ofd_v6.py
      - name: Commit fix
        run: |
          if git diff --quiet -- korgan/miniapp_api_v2.py tests/test_zz_miniapp_kaspi_ofd_v6.py; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add korgan/miniapp_api_v2.py tests/test_zz_miniapp_kaspi_ofd_v6.py
          git commit -m 'fix: allow production OFD Mini App origin'
          git push origin HEAD:feat/miniapp-full-agent-parity
