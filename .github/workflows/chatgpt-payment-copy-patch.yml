name: One-shot Mini App UI patch

on:
  push:
    branches: [chatgpt/payment-copy-case-meta-20260906]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - name: Apply exact UI patch
        run: python scripts/chatgpt_one_shot_ui_patch.py
      - name: Test and build Mini App
        working-directory: miniapp
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-payment-copy-patch.yml scripts/chatgpt_one_shot_ui_patch.py
          git add miniapp/src/main.jsx miniapp/src/caseCard.js miniapp/src/styles.css miniapp/test/case-card.test.js miniapp/test/payment-guidance.test.js
          git commit -m "fix(miniapp): clarify post-payment flow and ready case metadata [ui-copy-applied]"
          git push origin HEAD:chatgpt/payment-copy-case-meta-20260906
