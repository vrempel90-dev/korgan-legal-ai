name: Tole payment-link patch

on:
  push:
    branches: [feat/tole-auto-payments]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tole-auto-payments
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source patch
        run: python scripts/apply_tole_payment_link_patch.py
      - name: Verify targeted behavior
        run: |
          npm --prefix miniapp test -- test/document-payment-polling.test.js test/tole-payment-ui.test.js
          python -m py_compile korgan/miniapp_tole_payments.py
      - name: Commit final source
        run: |
          git config user.name "korgan-ci-patcher"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tole-payment-link-patch.yml scripts/apply_tole_payment_link_patch.py
          git add miniapp/src/main.jsx miniapp/src/documentPaymentPolling.js miniapp/test/document-payment-polling.test.js miniapp/test/tole-payment-ui.test.js korgan/miniapp_tole_payments.py
          git commit -m "feat(payments): use Tole payment link and automatic confirmation"
          git push origin HEAD:feat/tole-auto-payments
