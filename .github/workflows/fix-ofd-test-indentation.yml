name: Fix OFD test indentation

on:
  push:
    branches:
      - fix/telegram-consultation-ofd

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-consultation-ofd
      - name: Replace broken test block exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          replacement = base64.b64decode('').decode('utf-8')
          path = Path('tests/test_prepayment_before_generation.py')
          source = path.read_text(encoding='utf-8')
          source, count = re.subn(
              r'def test_new_receipt_flow_routes_exact_active_request_for_all_five_kinds\(monkeypatch\) -> None:\n.*?(?=def test_new_request_clears_all_payment_authorization_fields)',
              replacement,
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one block replacement, got {count}')
          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile tests/test_prepayment_before_generation.py
      - name: Commit exact fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_prepayment_before_generation.py
          git diff --cached --quiet && exit 0
          git commit -m 'test: fix OFD prepayment test structure'
          git push origin HEAD:fix/telegram-consultation-ofd
