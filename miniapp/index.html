      html, body, #root { margin: 0; min-height: 100%; background: #0B0F14; color: #F3F0E9; }
      html, body { min-height: 100vh; }
    </style>
    <script>
      (function () {
        var bootVersion = 'telegram-boot-4';

        function bootPing(stage, detail) {
          try {
            var query = '?stage=' + encodeURIComponent(stage)
              + '&detail=' + encodeURIComponent(String(detail || ''))
              + '&v=' + encodeURIComponent(bootVersion)
              + '&t=' + Date.now();
            fetch('/__korgan_boot' + query, { method: 'GET', cache: 'no-store', keepalive: true }).catch(function () {});
          } catch (_) {}
        }

        window.__KORGAN_BOOT_PING__ = bootPing;
        bootPing('html-script', 'readyState=' + document.readyState);

        window.addEventListener('error', function (event) {
          var message = event && (event.message || (event.error && event.error.message)) || 'window-error';
          bootPing('window-error', message);
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          bootPing('unhandled-rejection', reason && reason.message ? reason.message : String(reason || 'unknown'));
        });

        try {
          var raw = String(location.hash || '').replace(/^#/, '');
          var queryText = raw.indexOf('?') >= 0 ? raw.slice(raw.indexOf('?') + 1) : raw;
          var params = new URLSearchParams(queryText);
          var initData = params.get('tgWebAppData') || '';
          if (initData) window.__KORGAN_TG_INIT_DATA__ = initData;
          bootPing('telegram-params', 'init=' + (initData ? '1' : '0') + ',platform=' + (params.get('tgWebAppPlatform') || ''));
        } catch (error) {
          bootPing('telegram-params-error', error && error.message ? error.message : String(error));
        }

        function postTelegramEvent(eventType, eventData) {
          var payload = typeof eventData === 'undefined' ? '' : eventData;
          try {
            if (window.TelegramWebviewProxy && typeof window.TelegramWebviewProxy.postEvent === 'function') {
              window.TelegramWebviewProxy.postEvent(eventType, JSON.stringify(payload));
              return 'proxy';
            }
          } catch (error) {
            bootPing('telegram-proxy-error', error && error.message ? error.message : String(error));
          }
          try {
            if (window.external && typeof window.external.notify === 'function') {
              window.external.notify(JSON.stringify({ eventType: eventType, eventData: payload }));
              return 'external';
            }
          } catch (error) {
            bootPing('telegram-external-error', error && error.message ? error.message : String(error));
          }
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage(JSON.stringify({ eventType: eventType, eventData: payload }), '*');
              return 'iframe';
            }
          } catch (error) {
            bootPing('telegram-iframe-error', error && error.message ? error.message : String(error));
          }
          return 'none';
        }

        function signalTelegramReady(stage) {
          var via = postTelegramEvent('web_app_ready');
          bootPing(stage || 'telegram-ready', 'via=' + via);
          return via;
        }

        signalTelegramReady('telegram-ready-immediate');
        [50, 150, 350, 700, 1200, 2000].forEach(function (delay) {
          setTimeout(function () { signalTelegramReady('telegram-ready-' + delay); }, delay);
        });

        window.addEventListener('DOMContentLoaded', function () {
          bootPing('dom-content-loaded', 'root=' + Boolean(document.getElementById('root')));
          signalTelegramReady('telegram-ready-dom');
        }, { once: true });

        window.addEventListener('load', function () {
          var root = document.getElementById('root');
          bootPing('window-load', 'children=' + (root ? root.childElementCount : -1));
          signalTelegramReady('telegram-ready-load');
        }, { once: true });

        setTimeout(function () {
          var root = document.getElementById('root');
          bootPing('post-1500ms', 'children=' + (root ? root.childElementCount : -1));
        }, 1500);
      })();
    </script>
