    <link rel="preload" as="image" href="/__korgan_boot?stage=parser-preload&v=telegram-passive-1" />
    <script>
      (function () {
        var bootVersion = 'telegram-passive-1';

        function bootPing(stage, detail) {
          try {
            var query = '?stage=' + encodeURIComponent(stage)
              + '&detail=' + encodeURIComponent(String(detail || ''))
              + '&v=' + encodeURIComponent(bootVersion)
              + '&t=' + Date.now();
            fetch('/__korgan_boot' + query, { method: 'GET', cache: 'no-store', keepalive: true }).catch(function () {});
          } catch (_) {}
        }

        window.__KORGAN_BOOT_PING__ = bootPing;
        bootPing('html-script-passive', 'readyState=' + document.readyState);

        window.addEventListener('error', function (event) {
          var message = event && (event.message || (event.error && event.error.message)) || 'window-error';
          bootPing('window-error', message);
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          bootPing('unhandled-rejection', reason && reason.message ? reason.message : String(reason || 'unknown'));
        });

        try {
          var raw = String(location.hash || '').replace(/^#/, '');
          var queryText = raw.indexOf('?') >= 0 ? raw.slice(raw.indexOf('?') + 1) : raw;
          var params = new URLSearchParams(queryText);
          var initData = params.get('tgWebAppData') || '';
          if (initData) window.__KORGAN_TG_INIT_DATA__ = initData;
          bootPing('telegram-params-passive', 'init=' + (initData ? '1' : '0') + ',platform=' + (params.get('tgWebAppPlatform') || ''));
        } catch (error) {
          bootPing('telegram-params-error', error && error.message ? error.message : String(error));
        }

        // Do not call TelegramWebviewProxy/web_app_ready during initial parsing.
        // Telegram clients are required to remove their loading placeholder when
        // the page itself finishes loading, even if web_app_ready is not emitted.
        window.addEventListener('DOMContentLoaded', function () {
          bootPing('dom-content-loaded-passive', 'root=' + Boolean(document.getElementById('root')));
        }, { once: true });

        window.addEventListener('load', function () {
          var root = document.getElementById('root');
          bootPing('window-load-passive', 'children=' + (root ? root.childElementCount : -1));
        }, { once: true });

        setTimeout(function () {
          var root = document.getElementById('root');
          bootPing('post-1500ms-passive', 'children=' + (root ? root.childElementCount : -1));
        }, 1500);
      })();
    </script>
