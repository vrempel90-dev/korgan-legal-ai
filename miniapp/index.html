    <script>
      (function () {
        try {
          var raw = String(location.hash || '').replace(/^#/, '');
          var query = raw.indexOf('?') >= 0 ? raw.slice(raw.indexOf('?') + 1) : raw;
          var initData = new URLSearchParams(query).get('tgWebAppData') || '';
          if (initData) window.__KORGAN_TG_INIT_DATA__ = initData;
        } catch (_) {}

        function postTelegramEvent(eventType, eventData) {
          var payload = typeof eventData === 'undefined' ? '' : eventData;
          try {
            if (window.TelegramWebviewProxy && typeof window.TelegramWebviewProxy.postEvent === 'function') {
              window.TelegramWebviewProxy.postEvent(eventType, JSON.stringify(payload));
              return true;
            }
          } catch (_) {}
          try {
            if (window.external && typeof window.external.notify === 'function') {
              window.external.notify(JSON.stringify({ eventType: eventType, eventData: payload }));
              return true;
            }
          } catch (_) {}
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage(JSON.stringify({ eventType: eventType, eventData: payload }), '*');
              return true;
            }
          } catch (_) {}
          return false;
        }

        function signalTelegramReady() {
          return postTelegramEvent('web_app_ready');
        }

        function finishTelegramSdkInit() {
          signalTelegramReady();
          try { window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.ready(); } catch (_) {}
          try { window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.expand(); } catch (_) {}
          try { window.dispatchEvent(new Event('korgan:telegram-ready')); } catch (_) {}
        }

        function loadTelegramSdkAfterPageLoad() {
          if (document.getElementById('korgan-telegram-sdk')) return;
          var script = document.createElement('script');
          script.id = 'korgan-telegram-sdk';
          script.async = true;
          script.src = 'https://telegram.org/js/telegram-web-app.js?63&korgan=postload-1';
          script.onload = finishTelegramSdkInit;
          script.onerror = signalTelegramReady;
          document.head.appendChild(script);
        }

        signalTelegramReady();
        [50, 150, 350, 700, 1200, 2000, 3500, 5000].forEach(function (delay) {
          setTimeout(signalTelegramReady, delay);
        });
        window.addEventListener('DOMContentLoaded', signalTelegramReady, { once: true });
        window.addEventListener('load', function () {
          signalTelegramReady();
          setTimeout(loadTelegramSdkAfterPageLoad, 0);
        }, { once: true });

        window.__korganTelegramSdkReady = finishTelegramSdkInit;
      })();
    </script>
