norms:
  - code_id: "GK_RK_GENERAL"
    law_name: "Гражданский кодекс Республики Казахстан (Общая часть)"
    article_number: "353"
    title: "Ответственность за неправомерное пользование чужими деньгами"
    effective_from: "2021-01-01"
    source_url: "https://adilet.zan.kz/rus/docs/K940001000_"
    text: |-
      1. За неправомерное пользование чужими деньгами в результате неисполнения денежного обязательства либо просрочки в их уплате, либо их неосновательного получения или сбережения за счет другого лица подлежит уплате неустойка. Размер неустойки исчисляется, исходя из базовой ставки Национального Банка Республики Казахстан на день исполнения денежного обязательства или его соответствующей части. При взыскании долга в судебном порядке суд может удовлетворить требование кредитора, исходя из базовой ставки Национального Банка Республики Казахстан на день предъявления иска или на день вынесения решения, или на день фактического платежа по выбору кредитора. Эти правила применяются, если иной размер неустойки не установлен законодательными актами или договором.
      2. Неустойка за пользование чужими деньгами взимается по день уплаты суммы этих денег кредитору, если законодательством или договором не установлен иной порядок исчисления суммы неустойки.
      3. Если убытки, причиненные кредитору неправомерным пользованием его денежными средствами, превышают сумму неустойки, причитающуюся ему на основании пункта 1 настоящей статьи, он вправе требовать от должника возмещения убытков в части, превышающей эту сумму.
  - code_id: "GK_RK_SPECIAL"
    law_name: "Гражданский кодекс Республики Казахстан (Особенная часть)"
    article_number: "683"
    title: "Договор возмездного оказания услуг"
    effective_from: "2020-12-31"
    source_url: "https://adilet.zan.kz/rus/docs/K990000409_"
    text: |-
      1. По договору возмездного оказания услуг исполнитель обязуется по заданию заказчика оказать услуги (совершить определенные действия или осуществить определенную деятельность), а заказчик обязуется оплатить эти услуги.
      2. Правила настоящей главы применяются к договорам оказания услуг связи, медицинских, ветеринарных, аудиторских, консультационных, информационных услуг, услуг по обучению, туристическому обслуживанию и иных услуг, за исключением услуг по предоставлению персонала, а также услуг, оказываемых по договорам, предусмотренным главами 32, 34, 35, 39, 41, 43, 44 настоящего Кодекса.
  - code_id: "GK_RK_SPECIAL"
    law_name: "Гражданский кодекс Республики Казахстан (Особенная часть)"
    article_number: "686"
    title: "Односторонний отказ от исполнения договора возмездного оказания услуг"
    effective_from: "1999-07-01"
    source_url: "https://adilet.zan.kz/rus/docs/K990000409_"
    text: |-
      1. Заказчик вправе отказаться от исполнения договора возмездного оказания услуг при условии оплаты исполнителю фактически понесенных им расходов.
      2. Исполнитель вправе отказаться от исполнения обязательств по договору возмездного оказания услуг лишь при условии полного возмещения заказчику убытков, причиненных расторжением договора, кроме случая, когда это произошло по вине заказчика.
  - code_id: "GK_RK_SPECIAL"
    law_name: "Гражданский кодекс Республики Казахстан (Особенная часть)"
    article_number: "964"
    title: "Исключительные права на объекты интеллектуальной собственности"
    effective_from: "2015-04-21"
    source_url: "https://adilet.zan.kz/rus/docs/K990000409_"
    text: |-
      1. Исключительным правом на результат интеллектуальной творческой деятельности или средство индивидуализации признается имущественное право их обладателя использовать объект интеллектуальной собственности любым способом по своему усмотрению. Использование объекта исключительных прав другими лицами осуществляется с согласия правообладателя.
      2. Обладатель исключительного права на объект интеллектуальной собственности вправе передать это право другому лицу полностью или частично, разрешить использование объекта интеллектуальной собственности и распорядиться им иным образом, если это не противоречит правилам настоящего Кодекса и иных законодательных актов.
      3. Ограничения исключительных прав, признание этих прав недействительными и их прекращение (аннулирование) допускаются в случаях, пределах и порядке, установленных настоящим Кодексом и иными законодательными актами.
  - code_id: "GK_RK_SPECIAL"
    law_name: "Гражданский кодекс Республики Казахстан (Особенная часть)"
    article_number: "967"
    title: "Договор о создании и использовании результатов интеллектуальной творческой деятельности"
    effective_from: "2017-03-12"
    source_url: "https://adilet.zan.kz/rus/docs/K990000409_"
    text: |-
      1. Автор может принять на себя по договору обязательство создать произведение, изобретение или иной результат интеллектуальной творческой деятельности и предоставить заказчику, не являющемуся его работодателем, исключительные права на его использование.
      2. Договор, предусмотренный в пункте 1 настоящей статьи, должен определять характер подлежащего созданию результата интеллектуальной творческой деятельности, а также цели либо способы его использования.
      3. Условия договора, ограничивающие право автора создавать результаты интеллектуальной творческой деятельности определенного рода либо в определенной области, ничтожны.
  - code_id: "GPK_RK"
    law_name: "Гражданский процессуальный кодекс Республики Казахстан"
    article_number: "73"
    title: "Представление доказательств"
    effective_from: "2022-01-01"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000377"
    text: |-
      1. Доказательства представляются сторонами и другими лицами, участвующими в деле, суду первой инстанции при принятии иска с составлением ими досудебного протокола, в котором отражаются действия сторон и других лиц, участвующих в деле, по раскрытию, представлению и обмену доказательствами, на которые они намерены ссылаться как на основание своих требований или возражений и которыми они намерены воспользоваться в случае рассмотрения дела в суде. Доказательства могут быть представлены на стадии судебного разбирательства, если невозможность их представления на стадии подготовки дела к судебному разбирательству будет обоснована лицами, их представившими. В случае, предусмотренном частью второй статьи 404 настоящего Кодекса, доказательства могут быть представлены суду апелляционной инстанции. Непредставление суду имеющихся у сторон доказательств исключает возможность представления этих доказательств суду апелляционной, кассационной инстанций.
      2. Обстоятельства, имеющие значение для правильного разрешения дела, определяются судом на основании требований и возражений сторон и других лиц, участвующих в деле, с учетом подлежащих применению норм материального и процессуального права. Лицо вправе ссылаться только на те доказательства, которые были раскрыты и отражены в досудебном протоколе в ходе подготовки дела к судебному разбирательству либо в ходе судебного разбирательства, в случаях, установленных частью первой настоящей статьи.
      3. Суд вправе предложить сторонам и другим лицам, участвующим в деле, представить необходимые для правильного разрешения дела дополнительные доказательства.
      4. В случае, когда представление доказательств для сторон и других лиц, участвующих в деле, затруднительно, суд первой инстанции по их ходатайству оказывает им содействие в истребовании доказательств. Ходатайство об оказании содействия в истребовании необходимых стороне доказательств, оставленное без удовлетворения судом первой инстанции, может быть заявлено перед судом апелляционной инстанции в апелляционной жалобе или судебном заседании.
      5. В ходатайстве об оказании содействия в истребовании доказательства должны быть указаны доказательство, а также какие обстоятельства, имеющие значение для дела, могут быть установлены или опровергнуты этим доказательством, причины, препятствующие самостоятельному получению доказательства, и место его нахождения.
      6. При необходимости суд выдает лицу, участвующему в деле, запрос для получения доказательства. Лицо, у которого находится истребуемое судом доказательство, направляет его непосредственно в суд или выдает на руки лицу, имеющему соответствующий запрос суда, для представления доказательства в суд. Доказательства по корпоративным спорам должны быть истребованы только судом и направлены непосредственно в суд.
      7. В случае неизвещения суда о причинах непредставления истребованного доказательства, а также непредставления доказательства в установленный судом срок по причинам, признанным судом неуважительными, виновные должностные или иные лица, не участвующие в деле, подвергаются административному взысканию в соответствии с Кодексом Республики Казахстан об административных правонарушениях по правилам, установленным главой 9 настоящего Кодекса.
      8. Наложение административного взыскания не освобождает лицо, владеющее истребуемым судом доказательством, от обязанности его представления суду. В случае злостного неисполнения требования суда указанные лица несут уголовную ответственность.
      9. Если сторона удерживает у себя истребуемое судом доказательство и не представляет его по запросу суда в установленный судом срок, предполагается, что содержащиеся в нем сведения направлены против интересов этой стороны и считаются ею признанными.
      10. Стороны арбитражного разбирательства с согласия арбитража могут обратиться в суд с ходатайством о содействии в получении доказательств, которое рассматривается в соответствии с абзацем первым части четвертой настоящей статьи.
  - code_id: "LABOR_RK"
    law_name: "Трудовой кодекс Республики Казахстан"
    article_number: "22"
    part: "1"
    point: "21"
    title: "Основные права и обязанности работника"
    effective_from: "2016-01-01"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000414"
    text: "Работник имеет право на обжалование действий (бездействия) работодателя в области трудовых и непосредственно связанных с ними отношений."
  - code_id: "LABOR_RK"
    law_name: "Трудовой кодекс Республики Казахстан"
    article_number: "192"
    point: "3"
    title: "Принципы деятельности и основные задачи государственной инспекции труда"
    effective_from: "2026-06-08"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000414"
    text: "Основной задачей государственной инспекции труда является рассмотрение обращений работников, работодателей и их представителей по вопросам трудового законодательства Республики Казахстан."
  - code_id: "LABOR_RK"
    law_name: "Трудовой кодекс Республики Казахстан"
    article_number: "194"
    point: "4"
    title: "Обязанности государственных инспекторов труда"
    effective_from: "2026-06-08"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000414"
    text: "Государственные инспекторы труда обязаны своевременно рассматривать обращения работников, работодателей и их представителей по вопросам применения трудового законодательства Республики Казахстан."
  - code_id: "PDPA_94_V"
    law_name: "Закон Республики Казахстан от 21 мая 2013 года № 94-V «О персональных данных и их защите»"
    article_number: "2"
    title: "Цель настоящего Закона"
    effective_from: "2013-11-25"
    source_url: "https://adilet.zan.kz/rus/docs/Z1300000094"
    text: "Целью настоящего Закона является обеспечение защиты прав и свобод человека и гражданина при сборе и обработке его персональных данных."
  - code_id: "PDPA_94_V"
    law_name: "Закон Республики Казахстан от 21 мая 2013 года № 94-V «О персональных данных и их защите»"
    article_number: "31"
    title: "Порядок введения в действие настоящего Закона"
    effective_from: "2013-11-25"
    source_url: "https://adilet.zan.kz/rus/docs/Z1300000094"
    text: |-
      1. Настоящий Закон вводится в действие по истечении шести месяцев после его первого официального опубликования.
      2. Собственники и (или) операторы обязаны в течение трех месяцев со дня введения в действие настоящего Закона привести нормативные правовые акты и иные документы в соответствие с требованиями настоящего Закона.
      3. Сбор, обработка персональных данных, осуществленные согласно законодательству Республики Казахстан до введения в действие настоящего Закона, признаются соответствующими требованиям настоящего Закона, если дальнейшие их обработка и защита соответствуют целям их сбора.
