norms:
  - code_id: "TAX_RK_2025"
    law_name: "Налоговый кодекс Республики Казахстан"
    article_number: "665"
    part: "1"
    point: "1"
    title: "Ставки государственной пошлины в судах"
    effective_from: "2026-07-01"
    source_url: "https://adilet.zan.kz/rus/docs/K2500000214"
    text: |-
      Если иное не установлено настоящим пунктом, с исков имущественного характера: для физических лиц – 1 процент от суммы иска, но не более 10 000-кратного месячного расчетного показателя; для юридических лиц – 3 процента от суммы иска, но не более 20 000-кратного месячного расчетного показателя.
  - code_id: "BUDGET_RK_2026"
    law_name: "Закон Республики Казахстан «О республиканском бюджете на 2026 – 2028 годы»"
    article_number: "7"
    title: "Расчетные показатели на 2026 год"
    effective_from: "2026-01-01"
    effective_to: "2026-12-31"
    source_url: "https://adilet.zan.kz/rus/docs/Z2500000239"
    text: |-
      С 1 января 2026 года месячный расчетный показатель для исчисления пособий и иных социальных выплат, а также применения штрафных санкций, налогов и других платежей в соответствии с законодательством Республики Казахстан установлен в размере 4 325 тенге.
  - code_id: "GPK_RK"
    law_name: "Гражданский процессуальный кодекс Республики Казахстан"
    article_number: "27"
    part: "1"
    title: "Подсудность гражданских дел специализированным судам, специализированным составам суда"
    effective_from: "2026-07-01"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000377"
    text: |-
      Специализированные межрайонные экономические суды рассматривают и разрешают гражданские дела по имущественным и неимущественным спорам, сторонами в которых являются физические лица, осуществляющие индивидуальную предпринимательскую деятельность без образования юридического лица, юридические лица, а также по корпоративным спорам, за исключением дел, подсудность которых другому суду определена законом.
  - code_id: "GPK_RK"
    law_name: "Гражданский процессуальный кодекс Республики Казахстан"
    article_number: "29"
    part: "2"
    title: "Предъявление иска по месту нахождения ответчика"
    effective_from: "2016-01-01"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000377"
    text: |-
      Иск к юридическому лицу предъявляется в суд по месту нахождения юридического лица согласно учредительным документам и (или) адресу, внесенному в Национальный реестр бизнес-идентификационных номеров. Иск к организации без образования юридического лица предъявляется по месту ее нахождения.
  - code_id: "GK_RK_GENERAL"
    law_name: "Гражданский кодекс Республики Казахстан (Общая часть)"
    article_number: "173"
    title: "Начало срока, определяемого периодом времени"
    effective_from: "1994-12-27"
    source_url: "https://adilet.zan.kz/rus/docs/K940001000_"
    text: |-
      Течение срока, определяемого периодом времени, начинается на следующий день после календарной даты или наступления события, которыми определено его начало.
  - code_id: "GK_RK_GENERAL"
    law_name: "Гражданский кодекс Республики Казахстан (Общая часть)"
    article_number: "174"
    title: "Окончание срока, определяемого периодом времени"
    effective_from: "1994-12-27"
    source_url: "https://adilet.zan.kz/rus/docs/K940001000_"
    text: |-
      1. Срок, исчисляемый годами, истекает в соответствующий месяц и число последнего года срока. 2. К сроку, исчисляемому кварталами года, применяются правила для сроков, исчисляемых месяцами. 3. Срок, исчисляемый месяцами, истекает в соответствующее число последнего месяца срока. Если окончание срока, исчисляемого месяцами, приходится на такой месяц, в котором нет соответствующего числа, то срок истекает в последний день этого месяца. 4. Срок, исчисляемый неделями, истекает в соответствующий день последней недели срока.
  - code_id: "GK_RK_GENERAL"
    law_name: "Гражданский кодекс Республики Казахстан (Общая часть)"
    article_number: "175"
    title: "Окончание срока в нерабочий день"
    effective_from: "1994-12-27"
    source_url: "https://adilet.zan.kz/rus/docs/K940001000_"
    text: |-
      Если последний день срока приходится на нерабочий день, днем окончания срока считается ближайший следующий за ним рабочий день.
  - code_id: "GK_RK_GENERAL"
    law_name: "Гражданский кодекс Республики Казахстан (Общая часть)"
    article_number: "178"
    part: "1"
    title: "Сроки исковой давности"
    effective_from: "1994-12-27"
    source_url: "https://adilet.zan.kz/rus/docs/K940001000_"
    text: |-
      Общий срок исковой давности устанавливается в три года.
  - code_id: "GK_RK_GENERAL"
    law_name: "Гражданский кодекс Республики Казахстан (Общая часть)"
    article_number: "180"
    part: "2"
    title: "Течение срока исковой давности"
    effective_from: "1994-12-27"
    source_url: "https://adilet.zan.kz/rus/docs/K940001000_"
    text: |-
      По обязательствам с определенным сроком исполнения течение исковой давности начинается по окончании срока исполнения.
  - code_id: "GPK_RK"
    law_name: "Гражданский процессуальный кодекс Республики Казахстан"
    article_number: "122"
    title: "Исчисление процессуальных сроков"
    effective_from: "2016-01-01"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000377"
    text: |-
      1. Сроки для совершения процессуальных действий определяются точной календарной датой, указанием на событие, которое должно неизбежно наступить, или периодом времени, который исчисляется годами, месяцами или днями. 2. Течение процессуального срока, определяемого периодом, начинается на следующий день после календарной даты или наступления события, которыми определено его начало.
  - code_id: "GPK_RK"
    law_name: "Гражданский процессуальный кодекс Республики Казахстан"
    article_number: "123"
    title: "Окончание процессуальных сроков"
    effective_from: "2016-01-01"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000377"
    text: |-
      1. Срок, исчисляемый годами, истекает в соответствующий месяц и число последнего года срока. 2. Срок, исчисляемый месяцами, истекает в соответствующий последний месяц срока; если соответствующего числа нет, срок истекает в последний день этого месяца. 3. Срок, исчисляемый днями, истекает в последний день установленного периода. 4. Если последний день срока приходится на нерабочий день, днем окончания срока считается следующий за ним рабочий день.
  - code_id: "GPK_RK"
    law_name: "Гражданский процессуальный кодекс Республики Казахстан"
    article_number: "403"
    part: "3"
    title: "Порядок и сроки подачи апелляционных жалобы, ходатайства прокурора"
    effective_from: "2016-01-01"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000377"
    text: |-
      Апелляционные жалоба, ходатайство прокурора могут быть поданы в течение одного месяца со дня вынесения решения в окончательной форме, за исключением случаев, установленных настоящим Кодексом, а лицами, не участвовавшими в судебном разбирательстве, со дня направления им копии решения.
