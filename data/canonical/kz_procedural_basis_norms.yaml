  - code_id: "GPK_RK"
    law_name: "Гражданский процессуальный кодекс Республики Казахстан"
    article_number: "57"
    part: "2"
    title: "Ведение дел юридических лиц в суде"
    effective_from: "2025-07-01"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000377"
    text: |-
      Дела юридических лиц ведут в суде их руководители, действующие в пределах полномочий, предоставленных им законом, иными нормативными правовыми актами или учредительными документами, и (или) их представители. Руководитель юридического лица представляет суду документы, удостоверяющие его служебное положение или полномочие.
  - code_id: "GPK_RK"
    law_name: "Гражданский процессуальный кодекс Республики Казахстан"
    article_number: "60"
    part: "3"
    title: "Специальные полномочия представителя"
    effective_from: "2025-07-01"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000377"
    text: |-
      Полномочия представителя на совершение каждого из указанных в части первой настоящей статьи процессуальных действий должны быть специально предусмотрены в доверенности, выданной представляемым.
  - code_id: "GPK_RK"
    law_name: "Гражданский процессуальный кодекс Республики Казахстан"
    article_number: "61"
    part: "1"
    title: "Оформление полномочий представителя"
    effective_from: "2025-07-01"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000377"
    text: |-
      Полномочия представителя должны быть выражены в доверенности, выданной и оформленной в соответствии с законом. Доверенность представляется в суд в письменной форме или в форме электронного документа, удостоверенного электронной цифровой подписью доверителя.
  - code_id: "GPK_RK"
    law_name: "Гражданский процессуальный кодекс Республики Казахстан"
    article_number: "61"
    part: "3"
    title: "Полномочия адвоката"
    effective_from: "2025-07-01"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000377"
    text: |-
      Полномочия адвоката на ведение конкретного дела подтверждаются удостоверением адвоката и письменным уведомлением о защите (представительстве). Совершение адвокатом процессуальных действий, предусмотренных частью первой статьи 60 настоящего Кодекса, удостоверяется доверенностью.
  - code_id: "GPK_RK"
    law_name: "Гражданский процессуальный кодекс Республики Казахстан"
    article_number: "61"
    part: "5"
    title: "Полномочия юридического консультанта"
    effective_from: "2025-07-01"
    source_url: "https://adilet.zan.kz/rus/docs/K1500000377"
    text: |-
      Полномочия представителей, указанных в подпунктах 5) и 6) части первой статьи 58 настоящего Кодекса, могут быть выражены в доверенности или в случае личного участия в судебном заседании в устном заявлении доверителя, занесенном в протокол судебного заседания. Представителем, указанным в подпункте 6) части первой статьи 58 настоящего Кодекса, представляется документ, подтверждающий членство в палате юридических консультантов.
