[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "korgan-legal-ai"
version = "0.1.0"
description = "Safety-first legal drafting core for Kazakhstan"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.68.0",
  "httpx>=0.28.0",
  "cryptography>=46.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "alembic>=1.14.0",
  "PyYAML>=6.0.2",
  "typer>=0.12.0",
  "python-docx>=1.1.2",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[project.scripts]
korgan-legal = "korgan_legal_ai.cli:app"
korgan-telegram = "korgan_legal_ai.telegram.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/korgan_legal_ai"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
